<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ojace8143's typescript game</title>
    <style>
        :root {
            color-scheme: dark;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            box-sizing: border-box;
            background: #111;
            color: #eee;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 100vh;
        }

        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .tagline {
            margin: 0;
            color: #6f6f6f;
            font-size: 13px;
        }

        #join-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        #join-form label {
            color: #9a9a9a;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .join-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            width: 200px;
            padding: 7px 10px;
            background: #1c1c1c;
            border: 1px solid #444;
            border-radius: 3px;
            color: #eee;
            font: inherit;
            font-size: 14px;
        }

        input[type="text"]:focus {
            border-color: #00ff66;
            outline: none;
        }

        #game-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #status {
            margin: 0;
            min-height: 1.2em;
            max-width: 800px;
            text-align: center;
            color: #8a8a8a;
            font-size: 13px;
        }

        canvas {
            border: 1px solid #444;
            max-width: 100%;
            height: auto;
            display: block;
            touch-action: none;
        }

        .hud {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 14px;
            color: #9a9a9a;
        }

        #room-code {
            color: #00ff66;
            letter-spacing: 2px;
        }

        button {
            background: #1c1c1c;
            color: #eee;
            border: 1px solid #444;
            border-radius: 3px;
            padding: 6px 12px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        button:hover,
        button:focus-visible {
            border-color: #00ff66;
            color: #00ff66;
            outline: none;
        }

        .hint {
            margin: 0;
            color: #5c5c5c;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <section id="menu">
        <h2>typescript game</h2>
        <p class="tagline">one shared little world</p>
        <form id="join-form" autocomplete="off">
            <label for="name-input">your name</label>
            <div class="join-row">
                <input id="name-input" type="text" maxlength="16" spellcheck="false" autocomplete="off">
                <button type="submit">join lobby</button>
            </div>
        </form>
        <p class="hint">arrows / WASD to move</p>
    </section>

    <main id="game-view" hidden>
        <p id="status">connecting…</p>
        <canvas id="game" width="800" height="600"></canvas>
        <div class="hud">
            <span>room <strong id="room-code">------</strong></span>
            <button id="copy-link" type="button">copy invite link</button>
            <span id="player-count">1 player</span>
        </div>
        <p class="hint">arrows / WASD to move</p>
    </main>

    <!-- PeerJS handles WebRTC signaling; the game traffic itself is peer-to-peer. -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script type="module" src="./dist/main.js"></script>
</body>
</html>
